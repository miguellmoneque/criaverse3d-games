<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Criaverse3D Games — Nintendo 64</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b13;color:#f5f5fa;font-family:system-ui,Arial,sans-serif}main{max-width:900px;margin:auto;padding:20px}h1{font-size:25px}.panel{background:#191e2b;border:1px solid #3d465a;border-radius:14px;padding:18px}label{display:block;margin:12px 0 8px}input,button{font:inherit;max-width:100%}button{background:#7563db;color:white;border:0;border-radius:9px;padding:12px 18px;margin-top:14px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#game{display:none;width:100%;height:65vh;min-height:360px;background:#000;margin-top:18px}#status{min-height:1.5em}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c111b;border:1px solid #333b4e;padding:14px;border-radius:9px;font-size:12px;max-height:230px;overflow:auto}small{color:#b7c0d1}
</style>
</head>
<body><main>
<h1>🎮 Criaverse3D Games</h1>
<p>Teste do Nintendo 64 no EmulatorJS</p>
<section class="panel">
<label for="rom">Selecione uma ROM de Nintendo 64 obtida legalmente</label>
<input type="file" id="rom" accept=".z64,.n64,.v64">
<div><button type="button" id="play">Iniciar emulador</button></div>
<p id="status" role="status">Aguardando arquivo.</p>
<small>O arquivo é selecionado no seu dispositivo e não é enviado ao GitHub.</small>
</section>
<div id="game"></div>
<h2>Diagnóstico</h2><pre id="log">Nenhum teste iniciado.</pre>
<button id="copy" type="button">Copiar diagnóstico</button>
</main>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const log = $('log');
const status = $('status');
const play = $('play');
let romUrl = null;
function add(message) {
  if (log.textContent === 'Nenhum teste iniciado.') log.textContent = '';
  log.textContent += '[' + new Date().toLocaleTimeString('pt-BR') + '] ' + message + '\n';
  log.scrollTop = log.scrollHeight;
}
window.addEventListener('error', event => add('Erro JavaScript: ' + event.message));
window.addEventListener('unhandledrejection', event => add('Promessa rejeitada: ' + String(event.reason)));
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(log.textContent); status.textContent = 'Diagnóstico copiado.'; }
  catch { status.textContent = 'Copie o texto do diagnóstico manualmente.'; }
});
play.addEventListener('click', async () => {
  const file = $('rom').files[0];
  if (!file || !/\.(z64|n64|v64)$/i.test(file.name)) {
    status.textContent = 'Selecione um arquivo .z64, .n64 ou .v64.';
    return;
  }
  play.disabled = true;
  try {
    const header = new Uint8Array(await file.slice(0, 4).arrayBuffer());
    add('ROM: ' + file.name + ' (' + file.size + ' bytes)');
    add('Cabeçalho: ' + Array.from(header, x => x.toString(16).padStart(2, '0')).join(' '));
    if (romUrl) URL.revokeObjectURL(romUrl);
    romUrl = URL.createObjectURL(file);
    const game = $('game');
    game.style.display = 'block';
    window.EJS_player = '#game';
    window.EJS_core = 'n64';
    window.EJS_gameName = file.name;
    window.EJS_gameUrl = romUrl;
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;
    window.EJS_onGameStart = () => {
      status.textContent = 'Evento de início recebido. Verifique se a imagem aparece.';
      add('Evento: jogo iniciado (não confirma imagem)');
    };
    status.textContent = 'Carregando EmulatorJS...';
    const script = document.createElement('script');
    script.src = window.EJS_pathtodata + 'loader.js';
    script.onload = () => add('loader.js carregado');
    script.onerror = () => { status.textContent = 'Falha ao carregar loader.js'; add('Erro de rede: loader.js'); };
    document.body.appendChild(script);
    setTimeout(() => {
      add('Após 15 s: filhos de #game = ' + game.children.length);
      add('Após 15 s: EJS_player = ' + typeof window.EJS_player);
      if (game.children.length === 0) status.textContent = 'Interface não criada. Copie o diagnóstico.';
    }, 15000);
  } catch (error) {
    add('Erro ao iniciar: ' + String(error));
    status.textContent = 'Erro ao iniciar. Veja o diagnóstico.';
    play.disabled = false;
  }
});
})();
</script>
</body>
</html>
