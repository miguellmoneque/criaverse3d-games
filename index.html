<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#121529"><title>Criaverse3D Games</title><style>*{box-sizing:border-box}body{margin:0;background:#101426;color:white;font-family:system-ui,Arial;min-height:100vh;display:flex;justify-content:center}.wrap{width:min(100%,560px);padding:18px}header{text-align:center;margin-bottom:14px}h1{margin:4px;font-size:26px;color:#81f7df}p{color:#b8c0d4;margin:5px}canvas{width:100%;aspect-ratio:1/1;background:#090d1b;border:3px solid #414e75;border-radius:16px;display:block;touch-action:none} .controls{margin:16px auto;padding:20px 12px 18px;max-width:530px;border-radius:100px;background:linear-gradient(150deg,#eeeeef,#bcbcc3 65%,#a9a9b2);border:3px solid #9999a3;box-shadow:inset 0 4px 5px #fff9,0 9px 18px #0008;touch-action:none;user-select:none;color:#25252a}.controller-title{text-align:center;font-size:10px;letter-spacing:2px;font-weight:800;color:#686873;margin-bottom:8px}.controller-layout{display:grid;grid-template-columns:1fr .75fr 1fr;align-items:center;gap:3px}.controller-col{display:flex;align-items:center;justify-content:center}.pad{display:grid;grid-template-columns:repeat(3,29px);grid-template-rows:repeat(3,29px);transform:rotate(0deg)}.btn{border:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;font-weight:900}.dkey{background:#35353a;color:#d0d0d0;border-radius:3px;font-size:13px;box-shadow:inset 1px 2px 3px #ffffff35}.up{grid-column:2;grid-row:1}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:3}.right{grid-column:3;grid-row:2}.pad-center{grid-column:2;grid-row:2;background:#35353a;display:grid;place-items:center}.pad-center:after{content:'';width:15px;height:15px;border-radius:50%;background:#28282d;border:1px solid #555}.center-controls{display:flex;gap:12px;justify-content:center;align-items:center;transform:rotate(-28deg)}.small-control{width:28px;height:12px;border-radius:12px;background:#3b3b40;color:transparent;box-shadow:0 2px 1px #777;position:relative}.small-control:after{content:attr(aria-label);position:absolute;top:18px;left:50%;transform:translateX(-50%) rotate(28deg);font-size:8px;letter-spacing:.2px;color:#54545c}.right-buttons{position:relative;width:120px;height:118px;background:#a2a2ad;border-radius:50%;transform:rotate(-18deg)}.action{position:absolute;width:39px;height:39px;border-radius:50%;color:#fff9;font-size:12px;box-shadow:inset 0 3px 3px #fff6,0 3px 1px #666}.action-x{left:49px;top:9px;background:#9d91db}.action-y{left:9px;top:38px;background:#9d91db}.action-a{right:7px;top:48px;background:#514099}.action-b{left:47px;bottom:6px;background:#514099}.btn:active,.btn.active{filter:brightness(1.25);transform:translateY(2px)}.footer{text-align:center;font-size:13px;color:#abb5ce}a{color:#81f7df}@media(max-width:380px){.controls{padding:16px 6px;border-radius:75px}.pad{grid-template-columns:repeat(3,25px);grid-template-rows:repeat(3,25px)}.right-buttons{transform:rotate(-18deg) scale(.88)}}</style></head><body><main class="wrap"><header><h1>CRIAVERSE3D <span style="color:#fff">GAMES</span></h1><p>Mini aventura retrô • demonstração original</p></header><canvas id="game" width="480" height="480" aria-label="Jogo de coletar estrelas"></canvas><div class="controls"><div class="controller-title">CRIAVERSE3D • CONTROLE RETRÔ</div><div class="controller-layout"><div class="controller-col"><div class="pad"><button class="btn dkey up" data-key="up" aria-label="Cima">▲</button><button class="btn dkey left" data-key="left" aria-label="Esquerda">◀</button><div class="pad-center"></div><button class="btn dkey down" data-key="down" aria-label="Baixo">▼</button><button class="btn dkey right" data-key="right" aria-label="Direita">▶</button></div></div><div class="controller-col"><div class="center-controls"><button class="btn small-control" data-key="select" aria-label="SELECT">SELECT</button><button class="btn small-control" data-key="action" aria-label="START">START</button></div></div><div class="controller-col"><div class="right-buttons"><button class="btn action action-x" data-key="action">X</button><button class="btn action action-y" data-key="action">Y</button><button class="btn action action-a" data-key="action">A</button><button class="btn action action-b" data-key="action">B</button></div></div></div></div><p class="footer">Colete 10 estrelas e evite os obstáculos! Use o direcional para mover e A/START para começar ou reiniciar.<br>Também funciona com teclado.</p></main><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const keys={up:false,down:false,left:false,right:false};let player,stars,blocks,score,mode='start',last=0;function reset(){player={x:240,y:240,r:13};stars=[];blocks=[{x:100,y:100,w:90,h:24},{x:280,y:155,w:24,h:110},{x:110,y:340,w:130,h:24},{x:340,y:320,w:70,h:24}];score=0;mode='play';spawn()}function hit(x,y,r,b){return x+r>b.x&&x-r<b.x+b.w&&y+r>b.y&&y-r<b.y+b.h}function spawn(){for(let i=0;i<150;i++){const x=30+Math.random()*420,y=55+Math.random()*385;if(Math.hypot(x-player.x,y-player.y)>55&&!blocks.some(b=>hit(x,y,14,b))){stars=[{x,y}];return}}}function star(x,y,r=12){ctx.save();ctx.translate(x,y);ctx.beginPath();for(let i=0;i<10;i++){let a=i*Math.PI/5-Math.PI/2,d=i%2?r*.48:r;ctx.lineTo(Math.cos(a)*d,Math.sin(a)*d)}ctx.closePath();ctx.fillStyle='#ffe47b';ctx.fill();ctx.restore()}function draw(){ctx.fillStyle='#10182b';ctx.fillRect(0,0,480,480);ctx.strokeStyle='#1b2a45';for(let i=0;i<=480;i+=30){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,480);ctx.moveTo(0,i);ctx.lineTo(480,i);ctx.stroke()}ctx.fillStyle='#96a7d2';ctx.font='bold 20px system-ui';ctx.fillText('ESTRELAS: '+score+'/10',18,32);blocks.forEach(b=>{ctx.fillStyle='#45517a';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle='#7886b0';ctx.strokeRect(b.x,b.y,b.w,b.h)});stars.forEach(s=>star(s.x,s.y));ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fillStyle='#80f5db';ctx.fill();ctx.fillStyle='#152d3b';ctx.fillRect(player.x-6,player.y-4,4,4);ctx.fillRect(player.x+3,player.y-4,4,4);if(mode!=='play'){ctx.fillStyle='#070c1ddc';ctx.fillRect(25,150,430,185);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 30px system-ui';ctx.fillText(mode==='won'?'VOCÊ VENCEU!':'AVENTURA ESTELAR',240,212);ctx.font='17px system-ui';ctx.fillStyle='#b8e5e0';ctx.fillText(mode==='won'?'Parabéns! Todas as estrelas coletadas.':'Colete 10 estrelas pelo cenário!',240,251);ctx.fillText('Toque em A para '+(mode==='won'?'jogar novamente':'começar'),240,286);ctx.textAlign='left'}}function update(dt){if(mode!=='play')return;let dx=Number(keys.right)-Number(keys.left),dy=Number(keys.down)-Number(keys.up);if(dx||dy){const norm=Math.hypot(dx,dy),speed=Math.min(dt,0.04)*170;dx=dx/norm*speed;dy=dy/norm*speed;let nx=Math.max(14,Math.min(466,player.x+dx));if(!blocks.some(b=>hit(nx,player.y,player.r,b)))player.x=nx;let ny=Math.max(48,Math.min(466,player.y+dy));if(!blocks.some(b=>hit(player.x,ny,player.r,b)))player.y=ny}if(stars[0]&&Math.hypot(player.x-stars[0].x,player.y-stars[0].y)<27){score++;if(score>=10){stars=[];mode='won'}else spawn()}}function frame(t){let dt=last?(t-last)/1000:0;last=t;update(dt);draw();requestAnimationFrame(frame)}player={x:240,y:240,r:13};stars=[];blocks=[];requestAnimationFrame(frame);document.querySelectorAll('[data-key]').forEach(btn=>{let k=btn.dataset.key;function down(e){e.preventDefault();if(k==='action'){if(mode!=='play')reset()}else keys[k]=true;btn.classList.add('active')}function up(e){e.preventDefault();if(k!=='action')keys[k]=false;btn.classList.remove('active')}btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('lostpointercapture',up)});const mapping={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};document.addEventListener('keydown',e=>{if(mapping[e.key]){keys[mapping[e.key]]=true;e.preventDefault()}if(e.key===' '||e.key==='Enter'){if(mode!=='play')reset();e.preventDefault()}});document.addEventListener('keyup',e=>{if(mapping[e.key])keys[mapping[e.key]]=false});
</script></body></html>
