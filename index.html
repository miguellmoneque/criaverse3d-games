<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Criaverse3D Games • Nintendo 64</title><style>*{box-sizing:border-box}body{margin:0;background:#080a10;color:#fff;font-family:system-ui,sans-serif}main{max-width:650px;margin:auto;padding:18px}h1{font-size:23px;margin:12px 0}p{color:#c6c9d5;line-height:1.5}.panel{padding:16px;border:1px solid #343849;border-radius:14px;background:#151824}input{display:block;margin:12px 0;max-width:100%}button{background:#7364d8;color:#fff;border:0;border-radius:9px;padding:13px 18px;font-weight:700}#game{width:100%;height: min(76dvh, 650px);background:#000;display:none;margin-top:16px}small{color:#abb0c0}#status{font-size:13px}</style></head><body><main><h1>🎮 Criaverse3D Games</h1><p>Teste o EmulatorJS com Nintendo 64 e controles virtuais para celular.</p><div class="panel"><label for="rom">Escolha sua ROM de Nintendo 64 obtida legalmente:</label><input type="file" id="rom" accept=".z64,.n64,.v64"><button id="play">Iniciar emulador</button><p id="status" role="status"></p><small>O arquivo é lido no seu dispositivo; não é enviado ao GitHub. O emulador é carregado pela internet. Os controles são os do próprio EmulatorJS.</small></div><div id="game"></div></main><script>let url;document.getElementById('play').onclick=()=>{const f=document.getElementById('rom').files[0],status=document.getElementById('status');if(!f||!(/\.(z64|n64|v64)$/i.test(f.name))){status.textContent='Selecione um arquivo .z64, .n64 ou .v64.';return;}if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);window.EJS_player='#game';window.EJS_core='n64';window.EJS_gameUrl=url;window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';window.EJS_startOnLoaded=true;document.getElementById('game').style.display='block';document.getElementById('play').disabled=true;status.textContent='Carregando EmulatorJS…';let script=document.createElement('script');script.src=window.EJS_pathtodata+'loader.js';script.onerror=()=>{status.textContent='Não foi possível carregar o EmulatorJS. Verifique a conexão.';document.getElementById('play').disabled=false};document.body.appendChild(script)};</script></body></html>
