<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

#game {
  width: 100%;
  height: 100dvh;
  background: #000;
}

#setup {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: #000;
}

.panel {
  width: 100%;
  max-width: 360px;
  text-align: center;
}

.panel h2 {
  font-size: 19px;
  font-weight: 500;
}

.panel p {
  color: #aaa;
  font-size: 13px;
  line-height: 1.5;
}

.pick {
  display: block;
  padding: 15px;
  margin-top: 22px;
  background: #242424;
  border: 1px solid #777;
  border-radius: 9px;
  cursor: pointer;
}

#rom {
  display: none;
}

#status {
  margin-top: 15px;
  color: #aaa;
  font-size: 12px;
}

/* Ajustes visuais dos controles do EmulatorJS */
.ejs_virtualGamepad_button,
.ejs_virtualGamepad_dpad {
  opacity: 0.75;
}

@media (orientation: portrait) {
  #game {
    width: 100vw;
    height: 100dvh;
  }
}
/* Tamanho único dos quatro botões do N64 */
.ejs_virtualGamepad_parent .ejs_virtualGamepad_right
.ejs_virtualGamepad_button.cs_n64_b_x,
.ejs_virtualGamepad_parent .ejs_virtualGamepad_right
.ejs_virtualGamepad_button.cs_n64_b_y,
.ejs_virtualGamepad_parent .ejs_virtualGamepad_right
.ejs_virtualGamepad_button.cs_n64_b_a,
.ejs_virtualGamepad_parent .ejs_virtualGamepad_right
.ejs_virtualGamepad_button.cs_n64_b_b {
  width: 44px !important;
  height: 44px !important;
  line-height: 44px !important;
}
/* Letras e bordas mais destacadas */
.ejs_virtualGamepad_right .ejs_virtualGamepad_button {
  font-size: 14px !important;
  font-weight: 700 !important;
  color: #ffffff !important;
  border-color: rgba(255, 255, 255, 0.75) !important;
}
/* Subir todos os controles sem alterar os comandos */
@media (orientation: portrait) {
  .ejs_virtualGamepad_parent {
    transform: translateY(-45px) !important;
  }
}

</style>
</head>

    <div id="status" role="status"></div>

  /* Evitar abertura acidental do menu ao tocar em áreas vazias */
function protegerAreasVazias() {
  document.querySelectorAll(
    ".ejs_virtualGamepad_left, .ejs_virtualGamepad_right"
  ).forEach(area => {
    if (area.dataset.protecaoMenu === "1") return;
    area.dataset.protecaoMenu = "1";

    area.addEventListener("touchstart", evento => {
      if (!evento.target.closest(".ejs_virtualGamepad_button")) {
        evento.preventDefault();
      }
    }, { passive: false });
  });
}

      registrarEtapa("Falha no loader");
      started = false;
      loading.style.display = "none";
      setup.style.display = "flex";
      status.textContent =
        "Erro ao carregar o emulador.";
    };

    script.onload = function () {
      // O loader chegou, mas isso não garante que o núcleo N64 iniciou.
      registrarEtapa("Loader carregado; aguardando núcleo N64...");
      loading.style.display = "none";
      setTimeout(() => {
        registrarEtapa("30s após loader; tela do jogo abriu?");
      }, 30000);
    };
    document.body.appendChild(script);
  }
})();
// Ajustar o tamanho dos botões após o carregamento
const ajustarBotoes = () => {
  document.querySelectorAll(
    ".ejs_virtualGamepad_right .ejs_virtualGamepad_button"
  ).forEach(botao => {
    botao.style.setProperty("width", "44px", "important");
    botao.style.setProperty("height", "44px", "important");
    botao.style.setProperty("line-height", "44px", "important");
  });
};

const observadorBotoes = new MutationObserver(ajustarBotoes);

observadorBotoes.observe(document.body, {
  childList: true,
  subtree: true
});

ajustarBotoes();
</script>

</body>
</html>
