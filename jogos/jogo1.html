<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Criaverse3D Games - Jogo 1</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
background: #030816;
color: white;
font-family: Arial, sans-serif;
text-align: center;
}

.pagina {
max-width: 900px;
margin: auto;
padding: 12px;
}

/* Logo futurista */
.logo {
display: block;
width: 100%;
max-width: 700px;
height: auto;
margin: 0 auto 18px;
}

/* Moldura azul neon */
.moldura {
padding: 5px;
border: 2px solid #00cfff;
border-radius: 20px;
box-shadow: 0 0 22px #007bff80;
overflow: hidden;
background: black;
}

/* Emulador */
#game {
display: block !important;
width: 100%;
height: 65dvh;
min-height: 350px;
background: black;
}

#status {
padding: 12px;
color: #76dfff;
font-size: 14px;
}

/* Tela cheia sem moldura */
.moldura:fullscreen {
padding: 0;
border: 0;
border-radius: 0;
box-shadow: none;
width: 100vw;
height: 100dvh;
}

.moldura:fullscreen #game {
height: 100%;
min-height: 0;
}

:fullscreen {
border: none !important;
border-radius: 0 !important;
box-shadow: none !important;
}
</style>
</head>

<body>

<main class="pagina">

<!-- Logo Criaverse3D -->
<img
class="logo"
src="../imagens/visual.png"
alt="Criaverse3D Games"
>

<!-- Emulador -->
<section class="moldura">
<div id="game"></div>
</section>

<div id="status">Carregando jogo...</div>

</main>

<script>
window.EJS_player = "#game";
window.EJS_core = "n64";

/* Arquivo do jogo */
window.EJS_gameUrl = "../roms/jogo1.z64";

window.EJS_gameName = "Jogo 1";

window.EJS_pathtodata =
"https://cdn.emulatorjs.org/stable/data/";

window.EJS_startOnLoaded = true;
window.EJS_volume = 1;

window.EJS_onGameStart = function () {
document.getElementById("status").textContent =
"Jogo iniciado!";
};
</script>

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
