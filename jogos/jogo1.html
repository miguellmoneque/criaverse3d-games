<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1">
<title>Criaverse3D Games</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
background: #050510;
color: white;
font-family: Arial, sans-serif;
}

.console {
position: relative;
width: 100%;
max-width: 700px;
margin: 0 auto;
}

.visual {
display: block;
width: 100%;
height: auto;
}

/* Tela do jogo sobre a imagem */
#game {
position: absolute;
left: 0%;
top: 34%;
width: 100%;
height: 32%;
background: black;
overflow: hidden;
z-index: 2;
}

#game canvas,
#game iframe {
max-width: 100%;
}

/* Tela cheia: só o emulador */
#game:fullscreen {
position: fixed;
inset: 0;
width: 100vw;
height: 100dvh;
background: black;
}

.fullscreen {
display: block;
margin: 15px auto;
padding: 12px 20px;
background: #009dff;
border: none;
border-radius: 10px;
color: white;
font-size: 16px;
cursor: pointer;
}
</style>
</head>

<body>

<div class="console">
<img
class="visual"
src="../imagens/visual.png"
alt="Console Criaverse3D Games"
>

<div id="game"></div>
</div>

<button class="fullscreen" onclick="abrirTelaCheia()">
⛶ Tela cheia
</button>

<script>
window.EJS_player = "#game";
window.EJS_core = "n64";
window.EJS_gameUrl = "../roms/jogo1.z64";
window.EJS_gameName = "Jogo 1";
window.EJS_pathtodata =
"https://cdn.emulatorjs.org/stable/data/";
window.EJS_startOnLoaded = true;

function abrirTelaCheia() {
const jogo = document.getElementById("game");

if (jogo.requestFullscreen) {
jogo.requestFullscreen().catch(() => {
alert("Use o botão de tela cheia do emulador.");
});
}
}
</script>

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
