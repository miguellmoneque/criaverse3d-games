
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Criaverse3D Games</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #000;
  color: #fff;
  font-family: Arial, sans-serif;
}

#game {
  width: 100%;
  height: 100dvh;
  background: #000;
}

#setup {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: #000;
}

.panel {
  width: 100%;
  max-width: 360px;
  text-align: center;
}

.panel h2 {
  font-size: 19px;
  font-weight: 500;
}

.panel p {
  color: #aaa;
  font-size: 13px;
  line-height: 1.5;
}

.pick {
  display: block;
  padding: 15px;
  margin-top: 22px;
  background: #242424;
  border: 1px solid #777;
  border-radius: 9px;
  cursor: pointer;
}

#rom {
  display: none;
}

#status {
  margin-top: 15px;
  color: #aaa;
  font-size: 12px;
}

/* Ajustes visuais dos controles do EmulatorJS */
.ejs_virtualGamepad_button,
.ejs_virtualGamepad_dpad {
  opacity: 0.75;
}

@media (orientation: portrait) {
  #game {
    width: 100vw;
    height: 100dvh;
  }
}
/* Reduzir X, Y, A e B */
.ejs_virtualGamepad_parent .ejs_virtualGamepad_right
.ejs_virtualGamepad_button.cs_n64_b_x,
.ejs_virtualGamepad_parent .ejs_virtualGamepad_right
.ejs_virtualGamepad_button.cs_n64_b_y,
.ejs_virtualGamepad_parent .ejs_virtualGamepad_right
.ejs_virtualGamepad_button.cs_n64_b_a,
.ejs_virtualGamepad_parent .ejs_virtualGamepad_right
.ejs_virtualGamepad_button.cs_n64_b_b {
    width: 38px !important;
    height: 38px !important;
    line-height: 38px !important;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="setup">
  <div class="panel">
    
  

    <label class="pick" for="rom">
      Escolher jogo
    </label>

    <input
      id="rom"
      type="file"
      accept=".z64,.n64,.v64,application/octet-stream"
    >

    <div id="status"></div>
  </div>
</div>

<script>
(function () {
  const input = document.getElementById("rom");
  const setup = document.getElementById("setup");
  const status = document.getElementById("status");

  let started = false;

  input.addEventListener("change", function () {
    const file = input.files && input.files[0];

    if (!file || started) return;

    if (!/\.(z64|n64|v64)$/i.test(file.name)) {
      status.textContent =
        "Selecione um arquivo .z64, .n64 ou .v64.";
      return;
    }

    started = true;

    window.EJS_player = "#game";
    window.EJS_core = "n64";
    window.EJS_gameUrl = URL.createObjectURL(file);
    window.EJS_gameName =
      file.name.replace(/\.(z64|n64|v64)$/i, "");

    window.EJS_pathtodata =
      "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded = true;
    window.EJS_volume = 0.7;
    
    // HUD com setinhas controlando o analógico do N64



window.EJS_VirtualGamepadSettings = [
  // Setinhas — movimentação do Mario preservada
  {
    type: "dpad",
    location: "left",
    left: "50%",
    right: "50%",
    joystickInput: true,
    inputValues: [19, 18, 17, 16]
  },

  // ESC e DIR — faixa preta abaixo do jogo
  {
    type: "button",
    text: "ESC",
    id: "esc",
    location: "top",
    left: 12,
    top: 8,
    fontSize: 12,
    input_value: 10
  },
  {
    type: "button",
    text: "DIR",
    id: "dir",
    location: "top",
    right: 12,
    top: 8,
    fontSize: 12,
    input_value: 11
  },

  // Quatro botões compactos à direita
  {
    type: "button",
    text: "X",
    id: "x",
    location: "right",
    left: 35,
    top: 15,
    fontSize: 11,
    input_value: 9
  },
  {
    type: "button",
    text: "A",
    id: "a",
    location: "right",
    left: 70,
    top: 50,
    fontSize: 11,
    input_value: 8
  },
  {
    type: "button",
    text: "Y",
    id: "y",
    location: "right",
    left: 0,
    top: 50,
    fontSize: 11,
    input_value: 1
  },
  {
    type: "button",
    text: "B",
    id: "b",
    location: "right",
    left: 35,
    top: 85,
    fontSize: 11,
    input_value: 0
  },

  // Select e Start lado a lado
  {
    type: "button",
    text: "Select",
    id: "select",
    location: "center",
    left: -5,
    fontSize: 12,
    block: true,
    input_value: 2
  },
  {
    type: "button",
    text: "Start",
    id: "start",
    location: "center",
    left: 65,
    fontSize: 12,
    block: true,
    input_value: 3
  },

  // Rápido e Lento separados
  {
    type: "button",
    text: "Rápido",
    id: "rapido",
    location: "center",
    left: -105,
    top: 15,
    fontSize: 11,
    block: true,
    input_value: 27
  },
  {
    type: "button",
    text: "Lento",
    id: "lento",
    location: "center",
    left: 145,
    top: 15,
    fontSize: 11,
    block: true,
    input_value: 29
  }
];





    setup.style.display = "none";

    const script = document.createElement("script");

    script.src =
      "https://cdn.emulatorjs.org/stable/data/loader.js";

    script.onerror = function () {
      started = false;
      setup.style.display = "flex";
      status.textContent =
        "Erro ao carregar o emulador.";
    };

    document.body.appendChild(script);
  });
})();
// Ajustar o tamanho dos botões após o carregamento
const ajustarBotoes = () => {
  document.querySelectorAll(
    ".ejs_virtualGamepad_right .ejs_virtualGamepad_button"
  ).forEach(botao => {
    botao.style.setProperty("width", "38px", "important");
    botao.style.setProperty("height", "38px", "important");
    botao.style.setProperty("line-height", "38px", "important");
  });
};

const observadorBotoes = new MutationObserver(ajustarBotoes);

observadorBotoes.observe(document.body, {
  childList: true,
  subtree: true
});

ajustarBotoes();
</script>

</body>
</html>
